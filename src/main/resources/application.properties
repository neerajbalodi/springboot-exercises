# H2 in-memory - no external DB needed. Everything runs offline.
spring.datasource.url=jdbc:h2:mem:labsdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Batch inserts (Exercise 04) - the property half of the fix
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Statistics on so Exercise 10's test can count queries (N+1 detection)
spring.jpa.properties.hibernate.generate_statistics=true

# Uncomment to eyeball the SQL your code generates:
# spring.jpa.show-sql=true
# logging.level.org.hibernate.SQL=DEBUG
